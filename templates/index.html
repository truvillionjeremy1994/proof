<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #4ea8ff;
    }

    .description {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: white;
      line-height: 1.6;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    .count {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .red-dot {
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      margin-right: 8px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(255,0,0,0.6);
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.6); box-shadow: 0 0 20px rgba(255,0,0,1); }
    }

    .count-num {
      font-weight: bold;
      display: inline-block;
    }

    input[type="file"] {
      display: none;
    }

    .upload-label {
      background: linear-gradient(145deg, #1e90ff, #007bff);
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
      transition: all 0.2s ease;
    }

    .upload-label:hover {
      background: linear-gradient(145deg, #3399ff, #006be6);
      box-shadow: 0 0 18px rgba(0, 123, 255, 0.9);
    }

    #preview {
      max-width: 200px;
      border-radius: 8px;
      margin: 1rem auto 0 auto;
      display: none;
    }

    .action-buttons {
      margin-top: 1rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    .action-buttons button {
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .submit-btn {
      background: linear-gradient(145deg, #1e90ff, #007bff);
      color: white;
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.6);
    }

    .submit-btn:hover {
      background: linear-gradient(145deg, #3399ff, #006be6);
      box-shadow: 0 0 18px rgba(0, 123, 255, 0.9);
    }

    .cancel-btn {
      background: linear-gradient(145deg, #ff5c5c, #ff3b30);
      color: white;
      box-shadow: 0 0 12px rgba(255, 59, 48, 0.6);
    }

    .cancel-btn:hover {
      background: linear-gradient(145deg, #ff7b7b, #e52d1a);
      box-shadow: 0 0 18px rgba(255, 59, 48, 0.9);
    }

    .scan-loader {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    .scan-text {
      color: #aaa;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <h1>Hi, I'm Proof.👋🏾</h1>
  <p class="description">Upload any photo 📸 — I'll trace its digital footprint and tell you how confident I am if it's ✅ Honest or ❌ Deceptive.</p>
  <p class="count">
    <span class="red-dot"></span>
    <span class="count-num" id="photoCount">0</span> — Results issued and counting!
  </p>

  <label for="file-upload" class="upload-label" id="upload-label">Upload Photo Here</label>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input id="file-upload" name="image" type="file" accept="image/*" required onchange="previewImage(event)" />
    <img id="preview" src="#" alt="Photo Preview" />
    <div class="action-buttons" id="action-buttons">
      <button type="submit" class="submit-btn">Submit Photo</button>
      <button type="button" class="cancel-btn" onclick="resetUpload()">Cancel Upload</button>
    </div>
  </form>

  <div class="scan-loader" id="scanLoader">
    <div class="spinner"></div>
    <div class="scan-text">Scanning image...</div>
  </div>

  <script>
    function previewImage(event) {
      const preview = document.getElementById("preview");
      const actions = document.getElementById("action-buttons");
      const uploadLabel = document.getElementById("upload-label");
      const file = event.target.files[0];
      if (file) {
        uploadLabel.style.display = "none";
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = "block";
          actions.style.display = "flex";
        };
        reader.readAsDataURL(file);
      }
    }

    function resetUpload() {
      const upload = document.getElementById("file-upload");
      const preview = document.getElementById("preview");
      const actions = document.getElementById("action-buttons");
      const scanLoader = document.getElementById("scanLoader");
      const uploadLabel = document.getElementById("upload-label");

      upload.value = "";
      preview.src = "#";
      preview.style.display = "none";
      actions.style.display = "none";
      scanLoader.style.display = "none";
      uploadLabel.style.display = "inline-block";
    }

    async function fetchRealCount() {
      try {
        const res = await fetch("/count");
        const text = await res.text();
        const count = text.match(/\d+/); // extract number
        document.getElementById("photoCount").textContent = parseInt(count[0]).toLocaleString();
      } catch {
        document.getElementById("photoCount").textContent = "0";
      }
    }

    window.onload = () => {
      fetchRealCount();
      setInterval(fetchRealCount, 5000);
    };
  </script>
</body>
</html>
